name: Release Deno Deploy sources
on: workflow_dispatch
permissions: { contents: read }
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.22.3' }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: 2.5.6 }
      - run: npm ci --ignore-scripts --omit=optional && npm run audit:dependencies && npm test && deno task prepare && node scripts/stage-deno.mjs release
      - run: cd release && deno cache --no-remote --no-npm --frozen src/server-deno.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deno-release
          retention-days: 2
          path: release/
  deploy:
    needs: build
    environment: production-deno
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: deno-release }
      - uses: denoland/deployctl@35381c73621e1731268f80e51b54718d086f1e64
        with:
          project: ${{ vars.DENO_PROJECT_NAME }}
          entrypoint: src/server-deno.ts
          import-map: import_map.json
