name: Scan and promote container
on: workflow_dispatch
permissions: { contents: read }
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: '.node-version' }
      - run: npm ci --ignore-scripts --omit=optional && npm run audit:dependencies && npm run lint && npm test
  verify:
    needs: checks
    strategy:
      matrix:
        runtime: ["node", "bun"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Build without registry or deployment credentials
        run: docker build --platform linux/amd64 -t sdns:verified -f ${{ matrix.runtime }}.Dockerfile .
      - name: Check image UID and offline read-only bring-up
        run: sh scripts/check-image.sh ${{ matrix.runtime }} sdns:verified
      - name: Scan the exact image archive to be promoted
        run: |
          set -eu
          docker save sdns:verified -o image.tar
          sh scripts/ci-tool.sh syft "$RUNNER_TEMP"
          sh scripts/ci-tool.sh grype "$RUNNER_TEMP"
          "$RUNNER_TEMP/syft" docker-archive:image.tar -o spdx-json=sbom.spdx.json
          "$RUNNER_TEMP/grype" docker-archive:image.tar --fail-on high
          sha256sum image.tar sbom.spdx.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-${{ matrix.runtime }}
          path: |
            image.tar
            sbom.spdx.json
            SHA256SUMS
          retention-days: 2
  promote:
    needs: [checks, verify]
    strategy:
      matrix:
        runtime: ["node", "bun"]
    environment: production-images
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, attestations: write, id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'verified-${{ matrix.runtime }}' }
      - run: sha256sum -c SHA256SUMS && docker load -i image.tar
      - id: publish
        env: { GH_TOKEN: '${{ github.token }}', RUNTIME: '${{ matrix.runtime }}' }
        run: |
          set -eu
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$RUNTIME" != node ]]; then name="$name-$RUNTIME"; fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag sdns:verified "$name:$GITHUB_SHA"
          docker push "$name:$GITHUB_SHA"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$name:$GITHUB_SHA")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
