name: Release Cloudflare Worker
on: workflow_dispatch
permissions: { contents: read }
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.22.3' }
      - run: npm install --package-lock --ignore-scripts && npm run audit:dependencies && npm test && npm run build
      - name: Stage only the prebuilt worker and deployment configuration
        run: |
          mkdir -p release/dist
          cp dist/worker.js release/dist/
          # Parse configuration, not shell text: even a subsequently expanded
          # [build] or per-environment build hook must not run during promotion.
          python3 - <<'PYTHON'
          import json, tomllib
          with open("wrangler.toml", "rb") as source:
              cfg = tomllib.load(source)
          for scope in [cfg, *cfg.get("env", {}).values()]:
              scope.pop("build", None)
              scope.pop("minify", None)  # no transformation in --no-bundle mode
          with open("release/wrangler.json", "x") as target:
              json.dump(cfg, target)
          PYTHON
          # Carry this build's generated resolution to the isolated uploader;
          # npm ci below must install the same audited CLI, not resolve again.
          cp package.json package-lock.json release/
          cd release && ../node_modules/.bin/wrangler deploy --dry-run --no-bundle --env prod
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: worker-release, path: release/, retention-days: 2 }
  deploy:
    needs: build
    environment: production-workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: worker-release }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.22.3' }
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/wrangler deploy --no-bundle --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
