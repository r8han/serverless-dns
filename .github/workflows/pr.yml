name: PR checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: 'Fixture checks only (no deployment)'
        type: choice
        default: core
        options: [core, deno]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.22.3' }
      - run: npm install --ignore-scripts --package-lock --omit=optional && npm run lint && npm test
      - name: Audit full and runner dependency graphs
        run: npm run audit:dependencies
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Only an explicit manual choice can select the optional Deno runtime.
        target: ${{ fromJSON(inputs.target == 'deno' && '["deno"]' || '["node","bun","worker"]') }}
    # No secrets, deploy credentials, shared caches or publishable artifacts.
    env:
      BLOCKLIST_VERSION: 2024/1706100000000
      BLOCKLIST_MANIFEST: ${{ github.workspace }}/fixture/manifest.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.22.3' }
      - if: matrix.target != 'bun'
        run: npm install --ignore-scripts --no-package-lock
      - run: node test/prepare-fixture.mjs fixture && cp fixture/blocklist-metadata.json src/
      - if: matrix.target == 'node'
        run: npm run build:fly && node test/listener-smoke.mjs node
      - if: matrix.target == 'worker'
        run: npm run build && node test/worker-smoke.mjs && ./node_modules/.bin/wrangler deploy --dry-run --env prod
      - if: matrix.target == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: 2.5.6 }
      - if: matrix.target == 'deno'
        run: |
          deno check --no-lock src/server-deno.ts && deno run --no-lock test/conformance.mjs
          node test/listener-smoke.mjs deno
      - if: matrix.target == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: 1.3.3 }
      - if: matrix.target == 'bun'
        run: bun install --no-save --ignore-scripts --omit optional && bun test/conformance.mjs && bun run build:flybun && node test/listener-smoke.mjs bun
