name: Promote scanned Node image to Fly
on:
  workflow_dispatch:
    inputs:
      digest: { description: 'Approved GHCR image digest (sha256:...)', required: true }
permissions: { contents: read, packages: read, attestations: read }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    environment: production-fly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Verify digest and release workflow provenance; never rebuild on deploy
        env: { DIGEST: '${{ inputs.digest }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          set -eu
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sh scripts/ci-tool.sh gh "$RUNNER_TEMP"
          "$RUNNER_TEMP/gh" attestation verify "oci://$ref" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ghcr.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          echo "IMAGE=$ref" >> "$GITHUB_ENV"
          sh scripts/ci-tool.sh flyctl "$RUNNER_TEMP"
      - name: Deploy by digest with an app-scoped token
        env: { FLY_API_TOKEN: '${{ secrets.FLY_API_TOKEN }}', APP: '${{ vars.FLY_APP }}' }
        run: '"$RUNNER_TEMP/flyctl" deploy --config fly.toml --app "$APP" --image "$IMAGE" --strategy canary'
