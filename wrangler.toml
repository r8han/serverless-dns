name = "r8hhanhasabe-pvtt-serverless-dns-gg"
main = "./dist/worker.js"
workers_dev = true
logpush = false
compatibility_date = "2023-03-21"
send_metrics = false
upload_source_maps = false
minify = true

[observability]
enabled = false

[build]
command = "npm run build"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[vars]
LOG_LEVEL = "info"
WORKER_ENV = "development"
CLOUD_PLATFORM = "cloudflare"

##################
#------PROD------#
##################
# wrangler doesn't yet support Workers Services and the new "Environments"
# github.com/cloudflare/cloudflare-docs/pull/3175/files
# github.com/cloudflare/wrangler2/issues/27
# developers.cloudflare.com/workers/platform/environments
[env.prod]
name = "basic-unbound"
minify = true
# Add custom routes only for domains you control.
workers_dev = false
preview_urls = false
# vars are not inherited
# workers/platform/environment-variables#environment-variables-via-wrangler
logpush = false
[env.prod.observability]
enabled = false
[env.prod.vars]
LOG_LEVEL = "info"
WORKER_ENV = "production"
# Set DNS_ACCESS_MODE explicitly in your reviewed deployment configuration.
CLOUD_PLATFORM = "cloudflare"

##################
#------ONE-------#
##################
[env.one]
name = "dns-one"
logpush = false
minify = true
workers_dev = false
preview_urls = false

[env.one.observability]
enabled = false
[env.one.vars]
LOG_LEVEL = "info"
WORKER_ENV = "production"
# Set DNS_ACCESS_MODE explicitly in your reviewed deployment configuration.
CLOUD_PLATFORM = "cloudflare"
# Optional tenant-scoped storage/analytics require explicit bindings, a new
# dataset and independent collection/read grants. See docs/security/rollout.md.
